# Publishes a patched build to npm as @maxmo74/pi-coding-agent and moves the pointer that
# `pi update` reads, in one run, so no install can ever see a version that has no pointer.
#
# No npm credential is stored in this repository. Publishing authenticates with GitHub's OIDC token
# through npm's trusted publishing, which also generates provenance for the published version.
# Register this workflow on npmjs.com under the package's Settings -> Trusted publishing with:
# user maxmo74, repository pi, workflow filename publish.yml, tag pattern empty, "npm publish" allowed.
#
# A tag push is the only trigger that matters day to day. Upstream CI runs on main and on PRs, not on
# the fork's patch line, so the checks here are the gate between a rebase and a release.

name: Publish patched build

on:
  push:
    tags:
      - "v*"
  # A trusted publisher is bound to the workflow file that publishes, and an unbound config expires
  # after 2 days, so a manual run of this file is how that binding publish gets made.
  workflow_dispatch:
    inputs:
      revision:
        description: Publish <version in package.json>-max.<revision>
        required: true
        type: string

permissions: {}

jobs:
  publish:
    # Pinned, not `ubuntu-latest`: that label moves between Ubuntu majors without asking, which
    # changes the glibc, procps and npm a published artifact was built and tested on. The build step
    # prints the release so a provenance question has a log line to answer it.
    runs-on: ubuntu-24.04
    # Two publishes at once would race on the next free revision and on the pointer branch.
    concurrency:
      group: publish-patched
      cancel-in-progress: false
    permissions:
      # Write rather than read: the pointer push below reuses the credential actions/checkout stores.
      contents: write
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version
        id: version
        env:
          # A tag names the exact version to publish, so pushing the same tag twice cannot publish a
          # different version than it names; npm rejects the duplicate instead.
          TAG: ${{ github.ref_name }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          upstream=$(node -p "require('./packages/coding-agent/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${TAG#v}"
            if [[ "$version" == "$upstream" || "${version%-max.*}" != "$upstream" ]]; then
              echo "::error::Tag $TAG does not name this commit: expected v$upstream-max.<revision>"
              exit 1
            fi
            revision="${version##*-max.}"
          else
            revision="$REVISION"
            version="$upstream-max.$revision"
          fi
          if [[ ! "$revision" =~ ^[0-9]+$ ]]; then
            echo "::error::Revision must be a non-negative integer, got '$revision'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # fd and ripgrep are used by coding-agent tools tests.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Record the build host
        run: |
          set -euo pipefail
          grep -E "^(PRETTY_NAME|VERSION_ID)=" /etc/os-release
          node --version
          npm --version

      # Model data comes from the revision pinned in nix/model-catalog.json instead of a live
      # provider scrape, which is what `npm run release` and the Nix build do. `npm run build`
      # regenerates it by querying each provider's listing endpoint, and a provider that answers
      # with a truncated list yields a catalog whose model IDs do not match the ones this tag's own
      # tests name, so `npm run check` fails with type errors in packages/ai about a tree that is
      # fine -- which is what happened to the first attempt at 1.5.0-max.5. A pinned revision also
      # means the tag builds with the same model data every time, which is the point of a tag.
      - name: Hydrate the pinned model catalog
        run: node scripts/publish-patched.mjs --hydrate

      - name: Build
        run: npm run build:offline

      # Trusted publishing needs npm 11.5.1 or newer and the Node 22 line bundles npm 10.x; this is
      # the version upstream's own npm publish job upgrades to.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      # The full suite is upstream CI's job and needs a Rust toolchain for packages/env. These two
      # steps cover what a patched build can break: types, lint, entry graphs, the install lock, and
      # the package whose tree is published.
      - name: Check
        run: npm run check

      - name: Test the package being published
        run: npm test --workspace @earendil-works/pi-coding-agent

      - name: Stage and publish
        run: node scripts/publish-patched.mjs --publish --revision "${{ steps.version.outputs.revision }}"

      # npm holds a freshly published version invisible for minutes after it prints `+ published`,
      # four minutes in practice for this package. Moving the pointer across that gap would leave
      # `pi update` installing a version the registry has not served yet, which fails with ETARGET.
      - name: Wait for npm to serve the version
        run: |
          set -euo pipefail
          packageName=$(node -p "require('./patch/update-info.json').packageName")
          version=$(node -p "require('./patch/update-info.json').version")
          for attempt in $(seq 1 40); do
            if npm view "$packageName@$version" version >/dev/null 2>&1; then
              echo "$packageName@$version resolves"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$packageName@$version still does not resolve after 13 minutes; the pointer stays where it is"
          exit 1

      # The pointer is one file on the update-info branch, which `pi update` reads through
      # raw.githubusercontent.com. Commit it with git plumbing so the branch carries that file alone
      # instead of the whole tree, and push normally so the push fails if the branch moved.
      - name: Point pi update at the new version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail
          blob=$(git hash-object -w patch/update-info.json)
          export GIT_INDEX_FILE="$RUNNER_TEMP/update-info.index"
          git update-index --add --cacheinfo "100644,$blob,patch/update-info.json"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          git fetch --no-tags origin +refs/heads/update-info:refs/remotes/origin/update-info || true
          parent=$(git rev-parse -q --verify refs/remotes/origin/update-info || true)
          if [[ -n "$parent" ]]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "update pi update pointer to $VERSION")
          else
            commit=$(git commit-tree "$tree" -m "add pi update pointer for $VERSION")
          fi
          git push origin "$commit:refs/heads/update-info"

      # raw.githubusercontent.com answers with `cache-control: max-age=300`, so the old pointer can
      # be served for five minutes after the push lands. `1.5.0-max.2` proved the previous two-minute
      # budget was too short: the push succeeded and this step still saw the old version. Poll past
      # the full max-age rather than guessing the CDN will be fresh.
      - name: Verify the pointer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update-info/patch/update-info.json
          body=
          for attempt in $(seq 1 20); do
            body=$(curl -sf "$url" || true)
            if grep -q "\"version\": \"$VERSION\"" <<< "$body"; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 20
          done
          echo "::error::$url is not serving $VERSION after 6m40s:"
          printf '%s\n' "$body"
          exit 1

  # The untracked-process branch of the ownership guard is Linux-only, and it is the one refusal an
  # install on a server can hit without any Pi of this fork running. This job runs the tests that
  # cover it on RHEL-family userspace, which is what those servers actually run; the Ubuntu job above
  # proves the logic on the Debian family, and this one says the process scan behaves the same on the
  # other packaging of the same kernel interfaces. It publishes nothing and holds no permissions.
  # A container job still executes on the pinned GitHub runner, so this needs no self-hosted runner.
  ownership-rhel9:
    runs-on: ubuntu-24.04
    container:
      image: registry.access.redhat.com/ubi9/nodejs-22:latest
      options: --user root
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the image
        run: grep -E "^(PRETTY_NAME|VERSION_ID)=" /etc/os-release

      # UBI images carry no git, which npm needs for any dependency it fetches as a repository.
      - name: Install system dependencies
        run: dnf -y install git procps-ng >/dev/null

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Same hydration as the publish job: a build here that scraped live provider listings could
      # fail on model IDs the tests name rather than on anything about Linux ownership.
      - name: Hydrate the pinned model catalog
        run: node scripts/publish-patched.mjs --hydrate

      # The build is not optional here: session-manager.ts imports values from @earendil-works/pi-ai,
      # which imports @earendil-works/pi-schema, and those packages resolve to their dist/ output.
      # Running the test without a build fails with "Failed to resolve entry for package
      # '@earendil-works/pi-schema'", which is what the first run of this job did.
      - name: Build
        run: npm run build:offline

      # Only this file. The other ownership tests fork a TypeScript fixture and so depend on the Node
      # build in the image supporting type stripping, which the UBI module stream does not promise.
      - name: Run the Linux-only ownership tests
        working-directory: packages/coding-agent
        run: |
          set -euo pipefail
          export PI_CODING_AGENT_DIR=$(mktemp -d)
          ../../node_modules/.bin/vitest --run test/session-delete.test.ts
